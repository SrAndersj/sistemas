const C={
a:["Naves y gravedad","Una nave espacial que viaja entre planetas debe calcular la atracción gravitacional de los cuerpos celestes cercanos. En una misión reciente, la nave se aproximó a un planeta con el doble de masa que la Tierra y a una distancia de 10 000 km desde su centro. Los científicos deben evaluar cómo influirá esta atracción en la aceleración de la nave."],
b:["Preguntas 68 y 69","Una empresa farmacéutica desarrolla un medicamento que requiere condiciones precisas para controlar la velocidad de una reacción química que forma el principio activo. En el laboratorio se experimenta con cambios de temperatura, concentración y uso de catalizadores."],
d:["Preguntas 71 y 72","Estudiantes investigan cómo los satélites en órbita se comunican con las estaciones terrestres: estudian cómo los campos electromagnéticos permiten transmitir señales a través del espacio, sin necesidad de un medio material, y cómo la gravedad terrestre puede influir. Usan simuladores para modelar el campo eléctrico de una antena parabólica y el efecto del campo magnético terrestre en la trayectoria de los electrones."],
e:["Preguntas 73 a 75","El albinismo es causado por un gen recesivo autosómico, representado por “a”, mientras que el alelo dominante “A” permite la producción normal de melanina. En una familia, ambos padres presentan pigmentación normal, pero tienen dos hijos: uno con albinismo y otro con pigmentación normal."],
f:["Preguntas 76 a 78","Los estudiantes estudian el equilibrio químico de dos reacciones reversibles a diferentes temperaturas. Constante de equilibrio (K):"+T(["Temperatura (K)","K (Reacción A)","K (Reacción B)"],[["300","12×10²","4,5×10⁻³"],["350","46×10²","1,8×10⁻³"],["400","89×10²","0,7×10⁻³"]])],
g:["Preguntas 79 a 81","Un equipo escolar evalúa materiales para construir una celda solar experimental. Midieron la radiación absorbida (J/cm²) por tres materiales expuestos a la luz solar durante el mismo tiempo:"+T(["Material","Radiación absorbida (J/cm²)","Temperatura final (°C)"],[["A (Aluminio pulido)","12","33"],["B (Vidrio oscuro)","48","56"],["C (Plástico opaco)","36","44"]])],
h:["Preguntas 84 y 85","Estudiantes de grado once exploran el comportamiento de la luz en distintos medios: refracción, reflexión interna, difracción y absorción, y los relacionan con tecnologías como la comunicación óptica, microscopios y lentes correctivos. Observan que un haz de luz dirigido a través de una fibra de vidrio curva no sale del material, sino que permanece en su interior siguiendo el contorno de la fibra. También examinan cómo las lentes pueden corregir defectos visuales al cambiar la dirección de los rayos luminosos."],
i:["Preguntas 86 y 87","Desde hace décadas, los microorganismos se utilizan en diversos procesos industriales. Algunos hongos, como los del género Penicillium, han permitido el desarrollo de antibióticos, mientras que bacterias como Lactobacillus se emplean en la elaboración de productos lácteos fermentados. Además, otros microorganismos son esenciales en la biorremediación y la producción de biocombustibles."],
j:["Preguntas 89 y 90","Un grupo de estudiantes compara modelos atómicos con espectros de emisión de diferentes elementos usando un espectrómetro:"+T(["Elemento","Espectro observado (nm)"],[["Hidrógeno","410, 434, 486, 656"],["Sodio","589, 589"],["Neón","Múltiples líneas en 540-700"]])],
k:["Preguntas 91 y 92","En un laboratorio de fisiología, los estudiantes investigan cómo varía el pH sanguíneo en diferentes condiciones metabólicas. La gráfica muestra el cambio de pH en función del tiempo durante ejercicio físico intenso."+
'<svg viewBox="0 0 320 175" role="img" aria-label="Variación del pH sanguíneo durante el ejercicio"><g stroke="#8a93a3" stroke-width=".5" opacity=".6"><path d="M40 20H295M40 60H295M40 100H295M40 140H295M40 20V140M125 20V140M210 20V140M295 20V140"/></g><polyline fill="none" stroke="#c0446e" stroke-width="2" points="'+ph+'"/><g fill="currentColor" font-size="9"><text x="14" y="23">7,6</text><text x="14" y="63">7,4</text><text x="14" y="103">7,2</text><text x="14" y="143">7,0</text><text x="36" y="153">0</text><text x="118" y="153">10</text><text x="203" y="153">20</text><text x="288" y="153">30</text><text x="95" y="168">Tiempo de ejercicio (min)</text></g></svg>'],
l:["Preguntas 95 y 96","En una investigación de salud pública se analizan los métodos anticonceptivos usados por adolescentes. Resultados de una encuesta nacional:"+T(["Método utilizado","Porcentaje (%)"],[["Preservativo","42"],["Anticonceptivos orales","25"],["Ninguno","20"],["Otros (DIU, inyección, etc.)","13"]])],
m:["Pregunta 97","Un grupo analizó datos sobre las especies animales de una región del Parque Nacional Sierra de la Macarena durante 10 años. Individuos por especie en dos censos:"+T(["Especie","Población 2013","Población 2023"],[["Jaguar (Panthera onca)","48","15"],["Paujil (Crax alberti)","320","140"],["Danta (Tapirus terrestris)","90","28"],["Armadillo (Dasypus sp.)","430","410"]])],
n:["Pregunta 99","Se realiza un experimento con dos cilindros metálicos del mismo material. Uno gira sobre una superficie rugosa con mayor fuerza que el otro durante 60 segundos. Al final se mide la temperatura de ambos:"+T(["Cilindro","Fuerza aplicada (N)","Velocidad de rotación (rpm)","Temperatura final (°C)"],[["A","10","1200","42"],["B","20","1500","57"]])]
};
// [ctx, número, enunciado, opciones, correcta, explicación]
const Q=[
["a",65,"¿Cuál de las siguientes afirmaciones describe CORRECTAMENTE el efecto de la fuerza gravitacional sobre la nave al aproximarse al planeta mencionado?",["La nave experimentará una fuerza menor porque está en el espacio, donde no hay gravedad.","La fuerza será mayor que en la Tierra debido a la mayor masa del planeta, a pesar de la distancia.","La nave no sentirá ninguna fuerza hasta que entre en la atmósfera del planeta.","La fuerza será igual a la de la Tierra, porque la gravedad es constante en todo el universo."],1,"Según F = G·m₁·m₂/d², la fuerza aumenta con la masa del planeta y disminuye con el cuadrado de la distancia. La gravedad actúa en el espacio y no es constante."],
["",66,"¿Cuál sería la consecuencia si la nave duplicara su distancia con respecto al planeta?",["La fuerza gravitacional se duplicaría.","La fuerza gravitacional se reduciría a la mitad.","La fuerza gravitacional se reduciría a una cuarta parte.","La fuerza gravitacional se mantendría constante."],2,"La fuerza es inversamente proporcional a d². Si d se duplica: 1/2² = 1/4 de la fuerza."],
["",67,"Durante el trayecto, los ingenieros deben decidir entre continuar usando combustibles químicos o cambiar a paneles solares. ¿Qué pregunta sería más pertinente para tomar esta decisión?",["¿Qué combustible se ve mejor en las simulaciones virtuales de la nave?","¿Qué opción permite mayor eficiencia y menor contaminación en el espacio?","¿Cuál es el tipo de combustible usado por otras naves?","¿Cuál tecnología fue más económica hace diez años?"],1,"Una buena pregunta de indagación usa criterios técnicos y ambientales relevantes (eficiencia y contaminación), no apariencia, imitación ni precios antiguos."],
["b",68,"Un investigador incrementa la temperatura del sistema para aumentar la velocidad de reacción. ¿Qué fenómeno explica este cambio en la velocidad?",["A mayor temperatura, las moléculas colisionan con menos energía química.","La temperatura no influye en la velocidad de reacción.","A mayor temperatura, se incrementa la frecuencia y energía de las colisiones.","A mayor temperatura, se reduce la energía de activación."],2,"Al subir la temperatura las moléculas se mueven más rápido: chocan más veces y con más energía, y más colisiones superan la energía de activación (que no cambia)."],
["",69,"En la reacción Zn + 2HCl → ZnCl₂ + H₂, ¿por qué el zinc se considera como agente oxidante?",["Porque gana electrones.","Porque es el que se reduce.","Porque pierde electrones.","Porque se convierte en gas."],2,"Nota: el Zn pasa de 0 a +2, es decir, pierde electrones y se oxida (es el agente REDUCTOR). La premisa del enunciado es imprecisa; de las opciones, solo “pierde electrones” es químicamente correcta."],
["",70,"Un grupo de estudiantes trabaja con la reacción endotérmica entre KI y H₂O₂ catalizada por ácido acético, formando I₂. Diseñan un experimento para determinar la energía de activación (Ea) con la ecuación de Arrhenius K = A·e^(−Ea/RT). ¿Qué variable deben manipular y qué datos deben recolectar para estimar Ea?",["Manipular la concentración de KI y medir la presión.","Manipular el volumen de reacción y medir la entalpía.","Manipular la temperatura y medir la constante de velocidad.","Manipular la presión y medir la solubilidad del yodo."],2,"En Arrhenius, K depende de T. Midiendo K a distintas temperaturas (ln K vs 1/T) se obtiene Ea con la pendiente."],
["d",71,"Un estudiante modela la trayectoria de una partícula cargada que entra perpendicularmente a un campo magnético uniforme. ¿Cuál es la trayectoria esperada de la partícula y por qué?",["Línea recta, ya que el campo magnético no ejerce fuerza sobre partículas cargadas.","Parabólica, porque el campo magnético actúa como la gravedad.","Circular, debido a la fuerza magnética perpendicular a la velocidad de la partícula.","Elíptica, debido a la combinación de fuerzas magnéticas y eléctricas."],2,"La fuerza magnética (F = qvB) es siempre perpendicular a la velocidad: cambia la dirección pero no la rapidez, generando movimiento circular."],
["",72,"Durante el experimento, un estudiante afirma que la señal electromagnética emitida por el satélite requiere un medio para propagarse. ¿Cómo se puede evaluar esta afirmación?",["Es correcta porque toda onda necesita un medio material para propagarse.","Es incorrecta, ya que las ondas electromagnéticas se propagan en el vacío, a diferencia de las ondas mecánicas.","Es parcialmente correcta, pues las ondas electromagnéticas necesitan aire para transportarse.","Es correcta solo si el satélite se encuentra en la atmósfera terrestre."],1,"Las ondas EM (luz, radio, microondas) se propagan en el vacío; solo las mecánicas (sonido) necesitan un medio. Por eso nos llega la luz del Sol."],
["e",73,"¿Cuál debe ser el genotipo de los padres para que puedan tener un hijo con albinismo, si ambos tienen pigmentación normal?",["AA y AA","Aa y Aa","aa y aa","AA y aa"],1,"El hijo albino es aa: recibió una “a” de cada padre. Los padres son normales, así que ambos son portadores heterocigotos (Aa)."],
["",74,"¿Cuál es la probabilidad de que esta pareja tenga otro hijo con albinismo?",["0 %","25 %","50 %","75 %"],1,"Aa × Aa produce AA, Aa, Aa, aa (1/4). La probabilidad de aa es 25 % en cada embarazo, independiente de los anteriores."],
["",75,"¿Qué representa el hecho de que el albinismo no se exprese en los padres, pero sí en uno de los hijos?",["Que el albinismo es una enfermedad dominante que solo tiene el padre.","Que el albinismo es causado por una mutación somática.","Que el albinismo es una característica multifactorial.","Que el albinismo es un rasgo recesivo y los padres son portadores."],3,"Un rasgo recesivo se oculta en heterocigotos (portadores) y aparece cuando se heredan dos alelos recesivos."],
["f",76,"A partir de los datos proporcionados, ¿cuál de las siguientes afirmaciones es CORRECTA sobre las reacciones A y B?",["Ambas reacciones son exotérmicas, ya que la constante de equilibrio disminuye con la temperatura.","Solo la reacción A es endotérmica, porque su constante aumenta con la temperatura.","Solo la reacción B es endotérmica, porque su constante disminuye con la temperatura.","Ambas son endotérmicas, ya que sus constantes aumentan con la temperatura."],1,"Según Le Châtelier, si K aumenta al calentar, la reacción es endotérmica (A). Si K disminuye (B), es exotérmica."],
["",78,"Los estudiantes realizan una gráfica de ln(K) vs. 1/T (en K⁻¹) para la reacción A, obteniendo una recta descendente. ¿Qué información permite obtener esta gráfica?",["El valor del pH de la reacción.","El tipo de catalizador utilizado.","La concentración de los productos.","La entalpía estándar de la reacción."],3,"En la ecuación de van’t Hoff, la pendiente de ln K vs 1/T es −ΔH°/R. Pendiente negativa → ΔH > 0 (endotérmica)."],
["g",79,"¿Cuál de los materiales muestra mayor eficiencia en la transformación de la energía radiante en energía térmica?",["Material A, porque refleja menos radiación que los otros.","Material B, porque absorbe más energía y alcanza mayor temperatura.","Material C, porque es opaco y eso evita pérdidas de energía.","Todos los materiales son igual de eficientes porque estuvieron el mismo tiempo expuestos."],1,"B absorbió más (48 J/cm²) y llegó a la mayor temperatura (56 °C). El aluminio pulido refleja casi todo."],
["",80,"A partir del análisis de la gráfica del espectro electromagnético, determine cuáles rangos de longitud de onda serían más eficientes para generar mayor absorción térmica en los materiales ensayados.",["Longitudes de onda en el ultravioleta, porque son de alta frecuencia.","Longitudes de onda en el infrarrojo, porque transportan más energía térmica.","Longitudes de onda visibles, porque inciden de forma directa sobre el material.","Longitudes de onda en microondas, porque penetran más profundamente en los objetos."],1,"La radiación infrarroja es la que se asocia al calor: los cuerpos la absorben y se calientan."],
["",81,"Con base en los datos de la tabla inicial, los estudiantes quieren investigar qué material es más sostenible para su uso en una celda solar casera. ¿Cuál de las siguientes preguntas de indagación sería más pertinente para su estudio?",["¿Cuál material fue el más utilizado por otras instituciones en proyectos similares?","¿Qué tipo de celda solar produce más electricidad en países nublados?","¿Cómo varía la eficiencia térmica de los materiales al aumentar la radiación absorbida?","¿Qué tipo de vidrio genera mayor impacto visual en una maqueta?"],2,"Es la única pregunta que se puede responder con los datos de la tabla (radiación absorbida vs. temperatura)."],
["",82,"En una región con clima árido, una población de lagartijas presenta variaciones en el color de sus escamas: claras (arena), oscuras (café) y unas pocas con patrón intermedio. Tras varios años de sequía extrema, el ambiente se volvió desértico, con suelos más claros y menos vegetación. Un estudio reveló que el 90 % de las sobrevivientes eran de color arena. ¿Cuál mecanismo explica mejor el cambio?",["Herencia de caracteres adquiridos: las lagartijas arena desarrollaron escamas más claras durante su vida y transmitieron el cambio a su descendencia.","Deriva génica aleatoria: el aumento de lagartijas claras se debió a eventos fortuitos, sin relación con el ambiente.","Selección natural: las lagartijas de color arena tenían mayor ventaja de supervivencia en el nuevo ambiente desértico, lo que aumentó su frecuencia en la población.","Mutaciones dirigidas: las lagartijas oscuras generaron mutaciones específicas para volverse claras y así evitar a los depredadores."],2,"El ambiente seleccionó el rasgo ya existente (camuflaje) y los sobrevivientes se reprodujeron más. Los caracteres adquiridos no se heredan y las mutaciones no son dirigidas."],
["",83,"Durante una investigación en una selva húmeda tropical, biólogos analizan las interacciones entre árboles, hongos del suelo, aves y la cantidad de carbono almacenado. Los componentes vivos e inertes están interconectados en procesos como el reciclaje de nutrientes y la regulación del clima local. ¿Qué nivel de organización se está analizando?",["Nivel de organismo","Nivel de población","Nivel de comunidad","Nivel de ecosistema"],3,"Un ecosistema incluye seres vivos (comunidad) más factores abióticos (suelo, carbono, clima)."],
["h",84,"¿Qué principio físico permite que una señal luminosa enviada a través de una fibra óptica viaje varios kilómetros sin perder dirección ni energía significativa, incluso cuando la fibra se curva?",["La reflexión interna total, que mantiene la luz confinada dentro de la fibra.","La refracción continua, que redirige la luz hacia la superficie exterior.","La absorción parcial de la luz por las paredes del material conductor.","La difracción del haz, que permite que atraviese zonas opacas o curvas."],0,"Cuando la luz incide dentro de la fibra con un ángulo mayor al crítico, se refleja totalmente y queda “atrapada”."],
["",85,"Un estudiante con miopía logra enfocar correctamente objetos lejanos luego de usar gafas formuladas. ¿Qué fenómeno físico permite que las lentes logren este efecto?",["La absorción de ciertas longitudes de onda por parte del cristal.","La reflexión parcial de los rayos luminosos incidentes.","La refracción controlada que desvía los rayos hacia la retina.","La dispersión de la luz blanca en diferentes colores visibles."],2,"Las lentes refractan (desvían) los rayos para que converjan exactamente sobre la retina."],
["i",86,"¿Cuál de los siguientes procesos representa un ejemplo del uso de microorganismos para la producción de antibióticos?",["La fermentación del yogur mediante bacterias ácido-lácticas.","La utilización del hongo Penicillium para la elaboración de penicilina.","La incorporación de levaduras para obtener etanol a partir de azúcares.","El empleo de bacterias para degradar petróleo en derrames marinos."],1,"La penicilina, primer antibiótico, se obtiene del hongo Penicillium."],
["",87,"¿Qué característica permite a las bacterias del género Lactobacillus ser útiles en la producción de alimentos fermentados como el queso y el yogur?",["Su capacidad para producir antibióticos de amplio espectro.","Su capacidad de generar calor durante la respiración celular.","Su capacidad para fermentar azúcares y producir ácido láctico.","Su capacidad para degradar hidrocarburos tóxicos en el ambiente."],2,"Fermentan la lactosa a ácido láctico, que acidifica y coagula la leche."],
["j",89,"Los estudiantes relacionan los espectros observados con los modelos atómicos conocidos. ¿Cuál modelo atómico explica mejor los espectros lineales obtenidos?",["Modelo de Thomson, porque predice la distribución continua de carga.","Modelo de Dalton, porque considera al átomo como indivisible.","Modelo de Rutherford, porque propone un núcleo con cargas.","Modelo de Bohr, porque propone niveles energéticos cuantizados."],3,"Los espectros de líneas aparecen cuando los electrones saltan entre niveles de energía cuantizados, como propone Bohr."],
["",90,"Los estudiantes quieren determinar experimentalmente si hay relación entre la cantidad de líneas del espectro y la complejidad de la estructura electrónica. ¿Qué procedimiento garantizaría mayor validez en esta indagación?",["Realizar un solo ensayo por elemento y comparar cualitativamente.","Tomar datos solo de fuentes secundarias sobre cada elemento.","Repetir el experimento varias veces con control de variables y comparar espectros obtenidos.","Cambiar el voltaje del espectroscopio para variar los espectros y ampliar los resultados."],2,"La validez exige repetición y control de variables; un solo ensayo o cambiar variables sin control no permite concluir."],
